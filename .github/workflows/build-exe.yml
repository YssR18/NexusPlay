name: Build NexusPlay v4.0 Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer & Portable (.EXE)
        run: npm run dist

      - name: Upload Compiled .EXE Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NexusPlay-v4.0-Windows-EXE
          path: dist/*.exe
